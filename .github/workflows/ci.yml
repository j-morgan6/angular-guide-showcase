name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Testcontainers needs a Docker daemon; GitHub-hosted ubuntu-latest
      # runners ship one preinstalled and running, so no `services:` block
      # is needed here. Do not add one — it would just start a second,
      # unused daemon.
      - run: ./mvnw -B verify
